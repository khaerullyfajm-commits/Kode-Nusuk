var list=document.getElementById("list"),q=document.getElementById("q"),cnt=document.getElementById("cnt"),empty=document.getElementById("empty");
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).catch(function(){return fb(t)})}
  return fb(t);
}
function fb(t){
  return new Promise(function(res,rej){
    var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(a);a.select();
    try{document.execCommand("copy")?res():rej()}catch(e){rej()}
    document.body.removeChild(a);
  });
}
var used={};try{used=JSON.parse(localStorage.getItem("ngUsed")||"{}")}catch(e){}
function save(){try{localStorage.setItem("ngUsed",JSON.stringify(used))}catch(e){}}
function mark(li,k){used[k]=1;li.classList.add("used");var b=li.querySelector("button");b.textContent="Tersalin";b.disabled=true}
function unmark(li){li.classList.remove("used");var b=li.querySelector("button");b.textContent="Salin";b.disabled=false}
function flash(btn,txt){var old=btn.dataset.l;btn.textContent=txt;setTimeout(function(){btn.textContent=old},1200)}
D.forEach(function(k,i){
  var li=document.createElement("li");li.dataset.k=k.toLowerCase();
  li.innerHTML='<span class="n">'+(i+1)+'</span><code></code><button class="c" data-l="Salin">Salin</button>';
  li.querySelector("code").textContent=k;
  var b=li.querySelector("button");
  b.setAttribute("aria-label","Salin "+k);
  if(used[k])mark(li,k);
  b.onclick=function(){copy(k).then(function(){mark(li,k);save()},function(){flash(b,"Gagal")})};
  list.appendChild(li);
});
q.oninput=function(){
  var v=q.value.trim().toLowerCase(),n=0;
  Array.prototype.forEach.call(list.children,function(li){
    var s=!v||li.dataset.k.indexOf(v)>-1;li.hidden=!s;if(s)n++;
  });
  cnt.textContent=n;empty.hidden=n>0;
};
var all=document.getElementById("all");all.dataset.l="Salin semua";
all.onclick=function(){
  var v=[];Array.prototype.forEach.call(list.children,function(li){if(!li.hidden)v.push(li.querySelector("code").textContent)});
  copy(v.join("\n")).then(function(){Array.prototype.forEach.call(list.children,function(li){if(!li.hidden)mark(li,li.querySelector("code").textContent)});save();flash(all,"Tersalin")},function(){flash(all,"Gagal")});
};
document.getElementById("rst").onclick=function(){used={};save();Array.prototype.forEach.call(list.children,function(li){unmark(li)})};
</script>
